name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: courseai_test
          POSTGRES_USER: courseai
          POSTGRES_PASSWORD: courseai
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U courseai" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q
      - name: Embedder smoke tests (hash backend)
        working-directory: embedder
        run: ../backend/.venv/bin/python -m pytest -q test_main.py

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: courseai
          POSTGRES_USER: courseai
          POSTGRES_PASSWORD: courseai
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U courseai" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run alembic downgrade base
