[project]
name = "courseai-backend"
version = "0.1.0"
description = "FastAPI backend for the AI Knowledge Assistant (RAG over course materials)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "qdrant-client>=1.12",
    "httpx>=0.27",
    "redis>=5.0",
    "arq>=0.26",
    "openai>=1.40",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "langchain-text-splitters>=0.3",
    "tokenizers>=0.19",
    "huggingface-hub>=0.24",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.9",
    "filetype>=1.2",
    "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]
eval = [
    "langchain-openai>=1.7.2",
    "ragas>=0.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore:Payload indexes have no effect in the local Qdrant:UserWarning"]
