# Production-style stack on one host: Nginx (static SPA + /api proxy) in front, nothing else
# published. Put TLS in front of it (Caddy, a cloud load balancer, or Cloudflare).
#
#   cp .env.example .env   # set JWT_SECRET_KEY, LLM_API_KEY, POSTGRES_PASSWORD, COOKIE_SECURE=true
#   docker compose -f docker-compose.prod.yml up -d --build
name: courseai-prod

x-backend: &backend
  build: ./backend
  env_file: [.env]
  environment:
    ENVIRONMENT: production
    DATABASE_URL: postgresql+asyncpg://courseai:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/courseai
    QDRANT_URL: http://qdrant:6333
    REDIS_URL: redis://redis:6379/0
    EMBEDDER_URL: http://embedder:8001
    UPLOAD_DIR: /app/uploads
    LOG_JSON: "true"
  volumes: [uploads:/app/uploads]
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: courseai
      POSTGRES_USER: courseai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courseai -d courseai"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.20.0
    volumes: [qdrant_data:/qdrant/storage]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  embedder:
    build: ./embedder
    volumes: [model_cache:/models]
    restart: unless-stopped

  api:
    <<: *backend
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips='*'
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}
      redis: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      retries: 5

  worker:
    <<: *backend
    command: ["arq", "app.workers.ingest.WorkerSettings"]
    depends_on: [api]

  web:
    build:
      context: ./frontend
      target: prod
    ports: ["${HTTP_PORT:-80}:80"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  model_cache:
  uploads:
